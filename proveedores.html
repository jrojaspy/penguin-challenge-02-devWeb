<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Proveedores de servicios | Servicios Asunción</title>
  <meta name="description" content="Explora proveedores de servicios en Asunción, compara calificaciones y contáctalos directamente.">
  <meta name="theme-color" content="#4338ca">
  <link rel="icon" href="./img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/pages.css">
</head>
<body data-page="proveedores">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header" id="site-header"></header>

  <main id="contenido" tabindex="-1">
    <div class="container">
      <div class="page-head">
        <h1>Proveedores de servicios</h1>
        <p>Busca por nombre, categoría o zona.</p>
      </div>

      <form class="filters" id="filters" role="search" aria-label="Filtrar proveedores">
        <div class="field">
          <label for="search">Buscar</label>
          <input id="search" type="search" placeholder="Ej.: plomero, Recoleta…" autocomplete="off">
        </div>
        <div class="field">
          <label for="category">Categoría</label>
          <select id="category"><option value="">Todas</option></select>
        </div>
        <div class="field">
          <label for="sort">Ordenar por</label>
          <select id="sort">
            <option value="rating">Mejor calificados</option>
            <option value="resenas">Más reseñas</option>
            <option value="nombre">Nombre (A-Z)</option>
          </select>
        </div>
        <label class="check"><input id="fav-only" type="checkbox"> Solo favoritos</label>
        <button id="reset" type="button" class="btn btn--secondary" hidden>Limpiar filtros</button>
      </form>

      <p id="results-count" class="results-count" role="status"></p>
      <div id="state-region"></div>
      <ul id="provider-list" class="grid" aria-busy="true"></ul>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="./js/layout.js"></script>
  <script type="module" src="./js/proveedores.js"></script>
</body>
</html>
