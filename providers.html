<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Listado de proveedores de servicios locales."
  >

  <title>ServiPy | Proveedores</title>

  <link
    rel="stylesheet"
    href="./css/styles.css"
  >
</head>

<body>
  <header class="site-header">
    <div class="container header-content">
      <a
        class="brand"
        href="./index.html"
      >
        ServiPy
      </a>

      <nav
        class="main-nav"
        aria-label="Navegación principal"
      >
        <a href="./index.html">
          Inicio
        </a>

        <a
          href="./providers.html"
          aria-current="page"
        >
          Proveedores
        </a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <header class="page-header">
      <p class="eyebrow">
        Profesionales locales
      </p>

      <h1>
        Proveedores de servicios
      </h1>

      <p>
        Encuentra profesionales disponibles
        para diferentes necesidades.
      </p>
    </header>

    <section
      class="provider-controls"
      aria-labelledby="filter-title"
    >
      <div class="filter-group">
        <label
          id="filter-title"
          for="category-filter"
        >
          Filtrar por categoría
        </label>

        <select
          id="category-filter"
          name="category"
        >
          <option value="all">
            Todas las categorías
          </option>
        </select>
      </div>

      <p
        id="results-count"
        class="results-count"
        aria-live="polite"
      ></p>
    </section>

    <section
      aria-labelledby="providers-title"
    >
      <h2
        id="providers-title"
        class="sr-only"
      >
        Listado de proveedores
      </h2>

      <div
        id="providers-status"
        class="providers-status"
        role="status"
        aria-live="polite"
      ></div>

      <div
        id="providers-container"
        class="providers-grid"
      ></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        ServiPy — Servicios locales en Asunción
      </p>
    </div>
  </footer>

  <script
  src="./js/providers.js"
  defer
></script>

</body>
</html>
