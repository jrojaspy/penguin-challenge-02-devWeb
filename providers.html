<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Busca y filtra proveedores locales por nombre, servicio y categoría en ServiPy."
  >

  <meta
    name="color-scheme"
    content="light"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >
  <title>ServiPy | Proveedores</title>

  <link
    rel="stylesheet"
    href="./css/styles.css?v=11"
  >
</head>

<body>
  <a
    class="skip-link"
    href="#main-content"
  >
    Saltar al contenido principal
  </a>

  <header class="site-header">
    <div class="container header-content">
      <a
        class="brand"
        href="./index.html"
      >
        ServiPy
      </a>

      <nav
        class="main-nav"
        aria-label="Navegación principal"
      >
        <a href="./index.html">
          Inicio
        </a>

        <a
          href="./providers.html"
          aria-current="page"
        >
          Proveedores
        </a>
      </nav>
    </div>
  </header>

  <main
    id="main-content"
    class="container section"
  >
    <header class="page-header">
      <p class="eyebrow">
        Profesionales locales
      </p>

      <h1>
        Proveedores de servicios
      </h1>

      <p>
        Encuentra profesionales disponibles
        para diferentes necesidades.
      </p>
    </header>

    <section
      class="provider-controls"
      aria-labelledby="filters-title"
    >
      <h2
        id="filters-title"
        class="sr-only"
      >
        Buscar y filtrar proveedores
      </h2>

      <div class="provider-filters">
        <div class="filter-group">
          <label for="provider-search">
            Buscar proveedor o servicio
          </label>

          <input
            id="provider-search"
            type="search"
            name="search"
            placeholder="Ej.: plomería o Carlos"
            autocomplete="off"
          >
        </div>

        <div class="filter-group">
          <label for="category-filter">
            Filtrar por categoría
          </label>

          <select
            id="category-filter"
            name="category"
          >
            <option value="all">
              Todas las categorías
            </option>
          </select>
        </div>

        <button
          id="clear-filters"
          class="button button-secondary"
          type="button"
        >
          Limpiar filtros
        </button>
      </div>

      <p
        id="results-count"
        class="results-count"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
    </section>

    <section
      aria-labelledby="providers-title"
    >
      <h2
        id="providers-title"
        class="sr-only"
      >
        Listado de proveedores
      </h2>

      <div
        id="providers-status"
        class="providers-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>

      <div
        id="providers-container"
        class="providers-grid"
        aria-busy="true"
      ></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        ServiPy — Servicios locales en Asunción
      </p>
    </div>
  </footer>

  <script
    src="./js/providers.js?v=11"
    defer
  ></script>
</body>
</html>
