<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Consulta información, disponibilidad y medios de contacto de proveedores locales en ServiPy."
  >

  <meta
    name="color-scheme"
    content="light"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Detalle del proveedor | ServiPy</title>

  <link
    rel="stylesheet"
    href="./css/styles.css?v=11.1"
  >
</head>

<body>
  <a
    class="skip-link"
    href="#main-content"
  >
    Saltar al contenido principal
  </a>

  <header class="site-header">
    <div class="container header-content">
      <a
        class="brand"
        href="./index.html"
      >
        ServiPy
      </a>

      <nav
        class="main-nav"
        aria-label="Navegación principal"
      >
        <a href="./index.html">
          Inicio
        </a>

        <a href="./providers.html">
          Proveedores
        </a>
      </nav>
    </div>
  </header>

  <main
    id="main-content"
    class="container section"
  >
    <a
      class="back-link"
      href="./providers.html"
    >
      ← Volver a proveedores
    </a>

    <section
      class="detail-shell"
      aria-label="Información del proveedor"
    >
      <div
        id="detail-status"
        class="providers-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>

      <div
        id="provider-detail"
        aria-busy="true"
      ></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        ServiPy — Servicios locales en Asunción
      </p>
    </div>
  </footer>

  <script
    src="./js/detail.js?v=11"
    defer
  ></script>
</body>
</html>
